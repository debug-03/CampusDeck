{% extends 'base.html' %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div class="auth-split-container animate-fade-up">
    <!-- Left side info -->
    <div class="auth-split-info">
        <h1>CampusDeck</h1>
        <p>Your college work, organized in one place.</p>
        <ul class="auth-features-list">
            <li><i class="fa-solid fa-bullseye" style="color: var(--accent-primary);"></i> Goals</li>
            <li><i class="fa-solid fa-bookmark" style="color: var(--accent-success);"></i> Resources</li>
            <li><i class="fa-solid fa-briefcase" style="color: var(--accent-warning);"></i> Opportunities</li>
            <li><i class="fa-solid fa-note-sticky" style="color: #58a6ff;"></i> Notes</li>
        </ul>
    </div>
    
    <!-- Right side form -->
    <div class="auth-split-form-wrapper">
        <div class="auth-panel-form">
            <h2 style="font-size: 1.25rem; font-weight: 500; margin-bottom: 1.5rem; text-align: center;">Sign in</h2>
            
            <form action="{{ url_for('login') }}" method="POST">
                <!-- Email -->
                <div class="form-group" style="margin-bottom: 1.25rem;">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="e.g. student@university.edu" required>
                </div>
                
                <!-- Password -->
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn btn-primary hover-micro" style="width: 100%;">
                    Sign In
                </button>
            </form>
            
            <div style="margin-top: 1.5rem; border-top: 1px solid var(--border-color); padding-top: 1rem; font-size: 0.85rem; text-align: center;">
                <span style="color: var(--text-muted);">New student?</span> 
                <a href="{{ url_for('register') }}" style="color: var(--accent-primary); font-weight: 500;">Create an account</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block title %}Calendar{% endblock %}

{% block page_title %}Calendar{% endblock %}

{% block content %}
<div class="animate-fade-up">
    <p style="color: var(--text-muted); margin-bottom: 1.5rem; margin-top: -1rem; font-size: 0.8125rem;">View deadlines and events on your monthly calendar.</p>

    <div class="card-base calendar-container" style="padding: 1.5rem;">
        <div class="calendar-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <button id="prev-month" class="btn btn-secondary hover-micro"><i class="fa-solid fa-chevron-left"></i></button>
            <h2 id="calendar-month-year" style="font-size: 1.1rem; font-weight: 600; color: var(--text-primary); margin: 0;"></h2>
            <button id="next-month" class="btn btn-secondary hover-micro"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
        
        <div class="calendar-grid-header" style="display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: 600; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.5rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border-color);">
            <div>Sun</div>
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>
        </div>
        
        <div id="calendar-grid" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background-color: var(--border-color); border: 1px solid var(--border-color); border-radius: var(--radius-md); overflow: hidden;">
            <!-- Days will be generated by JS -->
        </div>
    </div>
</div>

<!-- Inject Python data into JS variables safely -->
<script>
    window.calendarData = {
        goals: {{ goals | tojson | safe }},
        opportunities: {{ opportunities | tojson | safe }}
    };
</script>
{% endblock %}
